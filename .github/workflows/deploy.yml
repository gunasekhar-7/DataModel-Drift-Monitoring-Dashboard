name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff mypy pytest httpx
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root --only main

      - name: Verify linting
        run: ruff check .

      - name: Verify type checking
        run: mypy app --ignore-missing-imports

      - name: Build Docker images
        run: |
          docker compose build api dashboard

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d db api dashboard
          docker compose ps
          docker compose logs --tail=50 api dashboard

      - name: Smoke test API
        run: |
          curl -f --retry 15 --retry-delay 3 --retry-all-errors http://localhost:8000/api/v1/health || { docker compose logs api; exit 1; }
          echo "API health check passed"

      - name: Smoke test Dashboard
        run: |
          curl -f --retry 15 --retry-delay 3 --retry-all-errors http://localhost:8501/_stcore/health || { docker compose logs dashboard; exit 1; }
          echo "Dashboard health check passed"
