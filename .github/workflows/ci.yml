name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff mypy pytest pytest-cov httpx hypothesis
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root --only main

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy app --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry pytest pytest-cov hypothesis httpx
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root --only main

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Generate coverage report
        run: python -m pytest --cov=app --cov-report=html

  build-and-test-docker:
    name: Build and Test Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: data-drift-monitoring/api:latest

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: data-drift-monitoring/dashboard:latest
