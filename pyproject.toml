[tool.poetry]
name = "data-drift-monitoring"
description = "Production-style Data & Model Drift Monitoring Platform"
authors = ["Kilo <kilo@ai>"]
version = "0.1.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
joblib = "^1.3.0"
sqlalchemy = "^2.0.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
psycopg2-binary = "^2.9.9"
alembic = "^1.12.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
scipy = "^1.11.0"
psutil = "^5.9.0"
prometheus-client = "^0.20.0"
structlog = "^24.1.0"
pyyaml = "^6.0.1"
streamlit = "^1.32.0"
plotly = "^5.18.0"
mlflow = "^2.9.0"
requests = "^2.31.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.8.0"
pytest-cov = "^5.0.0"
hypothesis = "^6.100.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
