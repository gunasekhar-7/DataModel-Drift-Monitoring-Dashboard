[tool.poetry]
name = "data-drift-monitoring"
description = "Production-style Data & Model Drift Monitoring Platform"
authors = ["Kilo <kilo@ai>"]
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.12.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
scipy = "^1.11.0"
evidently = "^0.4.15"
psutil = "^5.9.0"
streamlit = "^1.32.0"
plotly = "^5.18.0"
mlflow = "^2.9.0"
requests = "^2.31.0"
python-multipart = "^0.0.6"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.0.200"
mypy = "^1.7.0"
pytest-cov = "^5.0.0"

[tool.poetry.plugins]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target_version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]