services:
  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/drift_monitoring
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  # PostgreSQL database
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=drift_monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drift_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MLflow tracking server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_DEFAULT_ALLOW_UNREGISTERED_PARAMS=True
      - MLFLOW_ALLOW_FILE_STORE=true
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /app
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow
      --host 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  # Streamlit dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "dashboard/monitor.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/drift_monitoring
      - API_BASE_URL=http://api:8000
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - .:/app

  # Optional: Prometheus for metrics monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_data:
