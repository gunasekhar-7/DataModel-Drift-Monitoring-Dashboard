version: "3.8"

services:
  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/drift_monitoring
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      - db
    volumes:
      - .:/app

  # PostgreSQL database
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=drift_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MLflow tracking server
  mlflow:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_DEFAULT_ALBLOW_UNREGISTERED_PARAMS=True
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /app
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
    depends_on:
      - db

  # Streamlit dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://localhost:8000
      - ENVIRONMENT=development
    depends_on:
      - api
    volumes:
      - .:/app

  # Optional: Prometheus for metrics monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_data: